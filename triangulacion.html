<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Triangulación de Nodos</title>
    <style>
        body {
            background-color: #0a0a0a;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            border: 1px solid #00ff00;
            padding: 30px;
            box-shadow: 0 0 15px #00ff0033;
            max-width: 600px;
            width: 90%;
        }
        input {
            background: black;
            border: 1px solid #00ff00;
            color: #00ff00;
            padding: 8px;
            margin: 10px 0 20px 0;
            width: 80%;
            font-family: inherit;
            text-align: center;
        }
        button {
            background: #00ff00;
            color: black;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        button:hover { background: #00cc00; }
        .oculto { display: none; }
        .success-box { margin-top: 20px; color: white; border-top: 1px dashed #00ff00; padding-top: 20px; }
        label { font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        
        <!-- FASE 1: FIREWALL DE AMISTAD -->
        <div id="firewall">
            <h2>SISTEMA DE TRIANGULACIÓN BLOQUEADO. <br>SE REQUIERE PRUEBA DE IDENTIDAD.</h2>
            
            <label>1. ¿Hace cuántos años somos amigos?</label><br>
            <input type="text" id="q1" placeholder="Respuesta..."><br>
            
            <label>2. ¿Cuál es la fecha exacta en la que conocimos a Diego Fierro?</label><br>
            <input type="text" id="q2" placeholder="Respuesta..."><br>
            
            <label>3. ¿Qué juego singleplayer jugamos online de manera falsa y por llamada de whatsapp po wn?</label><br>
            <input type="text" id="q3" placeholder="Respuesta..."><br>
            
            <button onclick="validarIdentidad()">AUTENTICAR</button>
        </div>

        <!-- FASE 2: COORDENADAS (Oculto inicialmente) -->
        <div id="coordenadas" class="oculto">
            <h2>SISTEMA DE TRIANGULACIÓN ACTIVO</h2>
            <p>Pega las coordenadas exactas de Google Maps (latitud, longitud) de los tres nodos requeridos:</p>
            
            <label>Nodo 1 (Casa del cumpleañero):</label><br>
            <input type="text" id="coord1" placeholder="Ej: -37.084, -73.152"><br>
            
            <label>Nodo 2 (La mejor cancha de Chile):</label><br>
            <input type="text" id="coord2" placeholder="Ej: -37.084, -73.152"><br>
            
            <label>Nodo 3 (El acertijo: lugar donde performó a máximo nivel la Ana):</label><br>
            <input type="text" id="coord3" placeholder="Ej: -37.084, -73.152"><br>
            
            <button onclick="verificarCoordenadas()">VALIDAR TRIANGULACIÓN</button>

            <div id="resultado" class="oculto success-box"></div>
        </div>

    </div>

    <script>
        /* --- LÓGICA DEL FIREWALL DE AMISTAD --- */
        function validarIdentidad() {
            // Convertimos las respuestas a minúsculas para evaluar más fácil
            let r1 = document.getElementById('q1').value.toLowerCase();
            let r2 = document.getElementById('q2').value.toLowerCase();
            let r3 = document.getElementById('q3').value.toLowerCase();

            // Criterios flexibles:
            let check1 = r1.includes('11'); 
            let check2 = r2.includes('no se') || r2.includes('no hay') || r2.includes('no existe') || r2.includes('ni idea') || r2.includes('registro');
            let check3 = r3.includes('outlas'); // Cubre "outlast", "outlas", "outlast 1"

            if (check1 && check2 && check3) {
                document.getElementById('firewall').style.display = 'none';
                document.getElementById('coordenadas').style.display = 'block';
            } else {
                alert("INTRUSO DETECTADO. RESPUESTAS INCORRECTAS.");
            }
        }

        /* --- LÓGICA DE LAS COORDENADAS --- */
        // Coordenadas reales
        const NODO1 = { lat: -37.084739, lng: -73.152290 };
        const NODO2 = { lat: -37.097607, lng: -73.156938 };
        const NODO3 = { lat: -37.091621, lng: -73.164332 };
        
        // Tolerancia de ~100 metros
        const TOLERANCIA = 0.001; 

        function validarPunto(inputStr, target) {
            let partes = inputStr.replace(/ /g, '').split(',');
            if(partes.length !== 2) return false;
            
            let lat = parseFloat(partes[0]);
            let lng = parseFloat(partes[1]);
            
            if(isNaN(lat) || isNaN(lng)) return false;

            let diffLat = Math.abs(lat - target.lat);
            let diffLng = Math.abs(lng - target.lng);
            
            return (diffLat <= TOLERANCIA && diffLng <= TOLERANCIA);
        }

        function verificarCoordenadas() {
            let val1 = document.getElementById('coord1').value;
            let val2 = document.getElementById('coord2').value;
            let val3 = document.getElementById('coord3').value;
            let res = document.getElementById('resultado');

            let acierto1 = validarPunto(val1, NODO1);
            let acierto2 = validarPunto(val2, NODO2);
            let acierto3 = validarPunto(val3, NODO3);

            if (acierto1 && acierto2 && acierto3) {
                res.style.display = "block";
                res.innerHTML = `
                    <h3 style="color: #00ff00;">>>> TRIANGULACIÓN EXITOSA <<<</h3>
                    <p>Acceso concedido al servidor de cumpleaños.</p>
                    <p>Une las siguientes piezas en tu navegador para ver tu regalo:</p>
                    <br>
                    <p style="font-size: 14px;">
                        Parte 1: <b>https://drive.google.com/file/d/</b><br>
                        Parte 2: <b>TU_ID_DE_ARCHIVO_AQUI</b><br>
                        Parte 3: <b>/view?usp=sharing</b>
                    </p>
                `;
            } else {
                alert("ERROR: Una o más coordenadas están fuera de rango o mal formateadas. Asegúrate de pegarlas con el formato 'Latitud, Longitud'.");
            }
        }
    </script>
</body>
</html>
