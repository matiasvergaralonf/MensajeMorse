<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Triangulación de Nodos</title>
    <style>
        body {
            background-color: #0a0a0a;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            border: 1px solid #00ff00;
            padding: 30px;
            box-shadow: 0 0 15px #00ff0033;
            max-width: 600px;
        }
        input {
            background: black;
            border: 1px solid #00ff00;
            color: #00ff00;
            padding: 8px;
            margin: 10px 0;
            width: 80%;
            font-family: inherit;
            text-align: center;
        }
        button {
            background: #00ff00;
            color: black;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
        }
        button:hover { background: #00cc00; }
        .oculto { display: none; margin-top: 20px; color: white; border-top: 1px dashed #00ff00; padding-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>SISTEMA DE TRIANGULACIÓN ACTIVO</h2>
        <p>Pega las coordenadas exactas de Google Maps (latitud, longitud) de los tres nodos requeridos:</p>
        
        <label>Nodo 1 (Casa del cumpleañero):</label><br>
        <input type="text" id="coord1" placeholder="Ej: -37.084, -73.152"><br>
        
        <label>Nodo 2 (La mejor cancha de Chile):</label><br>
        <input type="text" id="coord2" placeholder="Ej: -37.084, -73.152"><br>
        
        <label>Nodo 3 (El acertijo: lugar donde performó a máximo nivel la Ana):</label><br>
        <input type="text" id="coord3" placeholder="Ej: -37.084, -73.152"><br>
        
        <button onclick="verificarCoordenadas()">VALIDAR TRIANGULACIÓN</button>

        <div id="resultado" class="oculto"></div>
    </div>

    <script>
        // Coordenadas reales
        const NODO1 = { lat: -37.084739, lng: -73.152290 };
        const NODO2 = { lat: -37.097607, lng: -73.156938 };
        const NODO3 = { lat: -37.091621, lng: -73.164332 };
        
        // Tolerancia de ~100 metros
        const TOLERANCIA = 0.001; 

        function validarPunto(inputStr, target) {
            // Limpiar el texto y separar por coma
            let partes = inputStr.replace(/ /g, '').split(',');
            if(partes.length !== 2) return false;
            
            let lat = parseFloat(partes[0]);
            let lng = parseFloat(partes[1]);
            
            if(isNaN(lat) || isNaN(lng)) return false;

            // Verificar si ambas coordenadas están dentro del radio de 100 metros
            let diffLat = Math.abs(lat - target.lat);
            let diffLng = Math.abs(lng - target.lng);
            
            return (diffLat <= TOLERANCIA && diffLng <= TOLERANCIA);
        }

        function verificarCoordenadas() {
            let val1 = document.getElementById('coord1').value;
            let val2 = document.getElementById('coord2').value;
            let val3 = document.getElementById('coord3').value;
            let res = document.getElementById('resultado');

            let acierto1 = validarPunto(val1, NODO1);
            let acierto2 = validarPunto(val2, NODO2);
            let acierto3 = validarPunto(val3, NODO3);

            if (acierto1 && acierto2 && acierto3) {
                res.style.display = "block";
                res.innerHTML = `
                    <h3 style="color: #00ff00;">>>> TRIANGULACIÓN EXITOSA <<<</h3>
                    <p>Acceso concedido al servidor de cumpleaños.</p>
                    <p>Une las siguientes piezas en tu navegador para ver tu regalo:</p>
                    <br>
                    <p style="font-size: 14px;">
                        Parte 1: <b>https://drive.google.com/file/d/</b><br>
                        Parte 2: <b>TU_ID_DE_ARCHIVO_AQUI</b><br>
                        Parte 3: <b>/view?usp=sharing</b>
                    </p>
                `;
            } else {
                alert("ERROR: Una o más coordenadas están fuera de rango o mal formateadas. Asegúrate de pegarlas con el formato 'Latitud, Longitud'.");
            }
        }
    </script>
</body>
</html>
